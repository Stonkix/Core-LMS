{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center
                                bg-primary-subtle rounded-circle mb-3"
                         style="width:64px;height:64px;">
                        <i class="bi bi-key-fill text-primary fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Добавить курс</h3>
                    <p class="text-muted small">Введите код который вам прислал преподаватель</p>
                </div>

                {% if error %}
                <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        {{ form.access_code }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 rounded-pill">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Записаться на курс
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="text-muted small text-decoration-none">
                        ← Вернуться на главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
