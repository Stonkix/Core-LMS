{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-4">Новый вопрос</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold">Текст вопроса</label>
                        {{ form.text }}
                    </div>
                    
                    <div class="p-4 bg-light rounded-4 mb-4">
                        <h6 class="fw-bold mb-3">Варианты ответов</h6>
                        {{ choice_formset.management_form }}
                        {% for c_form in choice_formset %}
                        <div class="row g-2 mb-3 align-items-center">
                            <div class="col-8">{{ c_form.text }}</div>
                            <div class="col-4 d-flex align-items-center">
                                <div class="form-check ms-2">
                                    {{ c_form.is_correct }}
                                    <label class="small text-muted ms-1">Верный</label>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Создать вопрос</button>
                        <a href="{% url 'manage_questions' quiz.id %}" class="btn btn-light border">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
