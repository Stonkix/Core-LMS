{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="text-center mb-5">
            <h2 class="fw-bold">{{ quiz.title }}</h2>
            <p class="text-muted small">Выберите один верный вариант в каждом вопросе</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for question in questions %}
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4"> {{ forloop.counter }}. {{ question.text }}</h5>
                    <div class="d-flex flex-column gap-2">
                        {% for choice in question.shuffled_choices %}
                        <div>
                            <input type="radio" class="btn-check" name="question_{{ question.id }}" id="c_{{ choice.id }}" value="{{ choice.id }}" required>
                            <label class="btn btn-outline-light w-100 text-start p-3 border text-dark q-opt" for="c_{{ choice.id }}">
                                {{ choice.text }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow">Завершить и сдать тест</button>
        </form>
    </div>
</div>

<style>
    .btn-check:checked + .q-opt { 
        background-color: #e7f1ff !important; 
        border-color: #0d6efd !important; 
        color: #0d6efd !important; 
        font-weight: 600;
    }
    .q-opt:hover { background-color: #f8f9fa; }
</style>
{% endblock %}
